<body>
    <div class="hero">
        <div class="time">
            <span id="hours">00</span>
            <p>HOURS</p>
        </div>
        <div class="time">
            <span id="minutes">00</span>
            <p>MINS</p>

        <div class="time">
            <span id="seconds">00</span>
            <p>SEC</p>
        </div>
    </div>
</body>

</html>
